"$schema": https://json-schema.org/draft/2020-12/schema
title: Transferability Statement
x-jsonld-context: context.jsonld
description: >
  The core, portable facts about where something's results are valid and what it takes to make
  them valid elsewhere — factored out of `ogc.focal.transferability.workflow` so the same bundle
  can eventually attach to something other than a CWL Workflow (a step, a process, a delivered
  dataset). Two properties:

  - `envelope` — the validity envelope, one or more
    [`envelopeConstraint`](bblocks://ogc.focal.transferability.envelopeConstraint) statements
    (`{role, dimension, value}`). Required: every evidenced case states at least one. This is also
    where a calendar span or scenario marker (a Global Warming Level, say) results are valid over
    belongs, as a `dimension: temporal` entry — see `envelopeConstraint` for its `{start, end}`/
    `{scenarioMarker}` shapes.
  - `artifactRules` — the reference/calibration artifacts and what must happen to each outside the
    envelope, each entry wrapping one or more
    [`rule`](bblocks://ogc.focal.transferability.rule) statements. Required, but **an empty array
    is a legitimate and meaningful value**: it says the artifacts were assessed and none needs
    adapting, which is a positive portability fact, quite different from the property being absent,
    which says nobody has looked yet. Requiring at least one entry would have forced anyone in the
    first situation to invent a rule.

  `computationType`, `maturityStatus`, and `qualityAnnotation` deliberately stay outside this
  bundle: they describe a workflow's implementation and result quality generally, not its
  portability boundary, so `ogc.focal.transferability.workflow` attaches them directly rather than
  through here.

  **`artifactRules`' wrapper shape** identifies the artifact by a free-text `artifact` label
  (e.g. "trained tree growth model (LightGBM, Czech PSP data)") plus an `artifactRole` classifying
  what kind of thing it is. The 8 FOCAL pilot-workflow questionnaires' artifacts turn out not to be
  uniformly workflow inputs: some are inputs (config/reference-data files), some are outputs later
  reused as another run's input (a trained model), and some never appear in an executable workflow
  description at all (physical infrastructure that must be re-deployed, not replaced as data; an
  optional validation reference that isn't a required artifact). `artifactRole` records which, and
  is always fillable from source text alone. `artifactRef` then locates the artifact inside the
  document this statement annotates, as a JSON Pointer — but only once such a document exists to
  point into; it's optional and meaningless for the `external-resource`/`infrastructure` roles,
  which have nothing to point at.
type: object
required:
  - envelope
  - artifactRules
properties:
  envelope:
    type: array
    minItems: 1
    items:
      "$ref": "bblocks://ogc.focal.transferability.envelopeConstraint"
    description: >
      The validity envelope, as one or more role/dimension/value statements. FP-WF1 alone needs
      three at once (trained-on/spatial, valid-for/ecological, can-run-on/climatic) — see
      `envelopeConstraint` for why role and dimension are independent axes.
  artifactRules:
    type: array
    items:
      type: object
      required:
        - artifact
        - artifactRole
        - rules
      properties:
        artifact:
          type: string
          description: >
            Free-text label identifying the reference or calibration artifact these rules apply to
            (e.g. "downscaled FOCAL climate data", "Quitt climate-zone thresholds/limits").
        artifactRole:
          type: string
          examples:
            - workflow-input
            - workflow-output
            - external-resource
            - infrastructure
          description: >
            What kind of thing this artifact is, independent of whether an executable workflow
            description exists that could give it an identifier yet: `workflow-input` — consumed as
            an input (a config file, parameter, or reference dataset); `workflow-output` — produced
            by (a step of) the workflow and reused as an input elsewhere, e.g. a trained model;
            `external-resource` — referenced by the workflow's documentation but not wired into its
            executable graph, e.g. an optional validation dataset; `infrastructure` — physical or
            operational, not data at all, e.g. a sensor network that must be re-deployed rather
            than replaced.

            Open vocabulary (SKOS), like every other controlled value in this model — see
            bblocks://ogc.focal.transferability.vocab. It was briefly a closed `enum`, which made
            it the one property here that contradicted the model's own stance, and it is also the
            newest and least-evidenced of them (four worked examples), so it is the likeliest to
            need a fifth term.
        artifactRef:
          type: string
          format: json-pointer
          pattern: "^/"
          examples:
            - /inputs/climate_data
            - /outputs/trained_growth_model
          description: >
            JSON Pointer (RFC 6901) locating the artifact inside the document this statement
            annotates. For the CWL Workflow profile in
            bblocks://ogc.focal.transferability.workflow that means `/inputs/<id>` or
            `/outputs/<id>`, but the pointer itself carries no CWL assumption — this block is
            deliberately not tied to CWL, since the `external-resource` and `infrastructure` roles
            have nothing to do with it. A JSON Pointer is also resolvable by off-the-shelf tooling,
            which the earlier dotted `inputs.<id>` string was not.

            Optional: only meaningful for the `workflow-input` and `workflow-output` roles, and
            only fillable once a real Application Package exists to point into. Omit it rather than
            guess an identifier.
        rules:
          type: array
          minItems: 1
          items:
            "$ref": "bblocks://ogc.focal.transferability.rule"
          description: One or more condition/action rules governing this artifact.
    description: >
      The reference/calibration artifacts and the rules governing how each must be adapted outside
      the validity envelope. Not every artifact a workflow depends on needs an entry here — only
      those with an evidenced transferability fact. An empty array means the assessment was done
      and nothing needs adapting; that is not the same as the property being absent.
