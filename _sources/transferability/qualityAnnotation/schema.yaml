"$schema": https://json-schema.org/draft/2020-12/schema
title: Quality Annotation
x-jsonld-context: context.jsonld
description: >
  A single statement of uncertainty or confidence about a workflow's results — a separate axis
  from `maturityStatus` (see bblocks://ogc.focal.transferability.maturityStatus): FP-WF1 is
  `operational` *and* carries a caveat that its results are decision-support, not exact, and the
  two facts don't collapse into one. Repeatable at the workflow level, same discipline as
  `envelopeConstraint`.

  Currently evidenced 1/8 (FP-WF1 only) — thinner evidence than any other confirmed transferability
  gap; expect this to grow once other workflow owners are consulted.

  **Binds directly to the W3C Data Quality Vocabulary (DQV, `https://www.w3.org/ns/dqv#`)**,
  checked 2026-09-02 against the published spec rather than assumed: `dimension` maps to
  `dqv:inDimension`, whose range `dqv:Dimension` is itself a `skos:Concept` — the open-SKOS-vocabulary
  pattern used everywhere else in this model turns out to already be DQV's own pattern, not just an
  analogy to it. No OGC Block wraps DQV (checked: no register or bblock defines it; the only other
  DQV usage anywhere in the bblocks ecosystem is a Tier-3 sibling,
  `ogc.hosted.iliad.api.features.indicator-quality-requirement`, shaped for a different domain), so
  this binds straight to the published namespace rather than depending on anything. `note` has no
  exact DQV equivalent (DQV's annotation body normally comes via `oa:hasBody`, heavier machinery
  than needed here) and stays a plain FOCAL property.

  A numeric quality measurement (which would map to `dqv:QualityMeasurement`) has no evidenced case
  yet and no property here. An earlier draft reserved a `measurement` property with no type and no
  binding, which validated literally any value and invited reviewers to fill it with anything; the
  intent is better recorded in prose until a real measurement turns up to shape it.
type: object
required:
  - dimension
properties:
  dimension:
    type: string
    examples:
      - decision-support-only
      - validation-incomplete
      - spatial-support-mismatch
    description: >
      What kind of uncertainty/confidence statement this is. Open vocabulary (SKOS), bound to
      `dqv:inDimension` -> `dqv:Dimension`.
  note:
    type: string
    description: >
      The statement itself, in free text (e.g. FP-WF1's caveat verbatim: "AI model and validation
      are still being finalised, results are decision-support not exact"). No DQV binding.
