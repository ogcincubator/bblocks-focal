"$schema": https://json-schema.org/draft/2020-12/schema
title: Transferability Workflow
x-jsonld-context: context.jsonld
description: >
  A profile of a CWL Workflow (`ogc.cwl.v1_2_1.CWLWorkflow`) adding the machine-readable
  transferability facts extracted from FOCAL's 8 pilot-workflow questionnaires. Ties together the
  other `transferability/*` blocks onto one workflow instance:

  - `envelope` — the workflow's validity envelope, one or more
    [`envelopeConstraint`](bblocks://ogc.focal.transferability.envelopeConstraint) statements
    (`{role, dimension, value}`). Required: every evidenced workflow states at least one.
  - `referenceArtifact` — the workflow's reference/calibration artifacts, each wrapping one or more
    [`rule`](bblocks://ogc.focal.transferability.rule) statements. Required for the same reason.
  - `computationType`, `maturityStatus` — the two workflow-level classification mixins (see
    [`computationType`](bblocks://ogc.focal.transferability.computationType) and
    [`maturityStatus`](bblocks://ogc.focal.transferability.maturityStatus) for which is optional
    and which is required).
  - `temporalExtent`, `qualityAnnotation` — repeatable workflow-level facts, both optional (see
    their own blocks for evidence density and omission rules).

  **`referenceArtifact`'s wrapper shape** identifies the artifact by a free-text `artifact` label
  (e.g. "trained tree growth model (LightGBM, Czech PSP data)") rather than a CWL input/step
  identifier — the 8 questionnaires describe artifacts this way, not by CWL id, and binding
  `artifact` to a concrete `steps`/`inputs` entry of the profiled `CWLWorkflow` is deliberately left
  for later, once real CWL Application Packages for these workflows exist to bind against, rather
  than guessed now.
allOf:
  - "$ref": "bblocks://ogc.cwl.v1_2_1.CWLWorkflow"
  - "$ref": "bblocks://ogc.focal.transferability.computationType"
  - "$ref": "bblocks://ogc.focal.transferability.maturityStatus"
  - type: object
    required:
      - envelope
      - referenceArtifact
    properties:
      envelope:
        type: array
        minItems: 1
        items:
          "$ref": "bblocks://ogc.focal.transferability.envelopeConstraint"
        description: >
          The workflow's validity envelope, as one or more role/dimension/value statements. FP-WF1
          alone needs three at once (trained-on/spatial, valid-for/ecological, can-run-on/climatic)
          — see `envelopeConstraint` for why role and dimension are independent axes.
      referenceArtifact:
        type: array
        minItems: 1
        items:
          type: object
          required:
            - artifact
            - rules
          properties:
            artifact:
              type: string
              description: >
                Free-text label identifying the reference or calibration artifact these rules
                apply to (e.g. "downscaled FOCAL climate data", "Quitt climate-zone
                thresholds/limits").
            rules:
              type: array
              minItems: 1
              items:
                "$ref": "bblocks://ogc.focal.transferability.rule"
              description: One or more condition/action rules governing this artifact.
        description: >
          The workflow's reference/calibration artifacts and the rules governing how each must be
          adapted outside the workflow's validity envelope. Not every artifact a workflow depends
          on needs an entry here — only those with an evidenced transferability fact.
      temporalExtent:
        type: array
        items:
          "$ref": "bblocks://ogc.focal.transferability.temporalExtent"
        description: >
          The calendar span(s), or scenario-indexed marker, the workflow's results are valid over.
          Optional and repeatable — see `temporalExtent` for the omission rule (no fixed window,
          e.g. an ongoing sensor observation) and the two supported shapes.
      qualityAnnotation:
        type: array
        items:
          "$ref": "bblocks://ogc.focal.transferability.qualityAnnotation"
        description: >
          Uncertainty/confidence statements about the workflow's results, independent of
          `maturityStatus`. Optional and repeatable.
