"$schema": https://json-schema.org/draft/2020-12/schema
title: Transferability Workflow
x-jsonld-context: context.jsonld
description: >
  A profile of a CWL Workflow (`ogc.cwl.v1_2_1.CWLWorkflow`) adding FOCAL's machine-readable
  transferability facts, extracted from FOCAL's 8 pilot-workflow questionnaires:

  - `transferability` — the workflow's portability boundary, one
    [`transferabilityStatement`](bblocks://ogc.focal.transferability.transferabilityStatement)
    (its `envelope` and `artifactRules`). Required: every evidenced workflow states one.
  - `computationType`, `maturityStatus` — the two workflow-level classification mixins (see
    [`computationType`](bblocks://ogc.focal.transferability.computationType) and
    [`maturityStatus`](bblocks://ogc.focal.transferability.maturityStatus) for which is optional
    and which is required).
  - `qualityAnnotation` — a repeatable, optional workflow-level fact (see its own block for
    evidence density and omission rules).

  `computationType`/`maturityStatus`/`qualityAnnotation` stay outside `transferability` on
  purpose: they describe the workflow's implementation and result quality generally, not its
  portability boundary — see `transferabilityStatement` for the same distinction from its side.
allOf:
  - "$ref": "bblocks://ogc.cwl.v1_2_1.CWLWorkflow"
  - "$ref": "bblocks://ogc.focal.transferability.computationType"
  - "$ref": "bblocks://ogc.focal.transferability.maturityStatus"
  - type: object
    required:
      - transferability
    properties:
      transferability:
        "$ref": "bblocks://ogc.focal.transferability.transferabilityStatement"
        description: >
          The workflow's portability boundary: where its results are valid (`envelope`) and what
          must happen to each reference/calibration artifact outside it (`artifactRules`). See
          `transferabilityStatement` for both properties' shapes.
      qualityAnnotation:
        type: array
        items:
          "$ref": "bblocks://ogc.focal.transferability.qualityAnnotation"
        description: >
          Uncertainty/confidence statements about the workflow's results, independent of
          `maturityStatus`. Optional and repeatable.
