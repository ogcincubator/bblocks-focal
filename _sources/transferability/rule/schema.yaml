"$schema": https://json-schema.org/draft/2020-12/schema
title: Transferability Rule
x-jsonld-context: context.jsonld
description: >
  What must happen, to which artifacts, under which envelope conditions.

  - `appliesTo` — the artifacts this rule governs, by `id`. Omit it for a rule about the workflow
    as a whole.
  - `when` — the conditions, each citing an envelope constraint by `id` and how the target is
    tested against it (`inside`/`outside`). **Conjunctive: all of them must hold.** A disjunction
    is written as two rules.
  - `actions` — an **OR-set**: any one resolves the rule. Never a sequence, never a combination to
    apply together.
  - `mandatory` — whether applying one is required once the conditions hold.

  **`when` is what makes a rule evaluable rather than merely readable.** `triggeredBy:
  different-geographic-coverage` is a string a person reads; `when: [{constraint: clms-coverage,
  test: outside}]` names the boundary, and if that constraint's dimension is spatial its value is a
  `geo:asWKT` geometry, so a GeoSPARQL engine can settle the question with `geof:sfWithin`. Where
  the cited constraint is prose-valued (a comparable ecological range), the same structure records
  a judgement a person still has to make — which is honest about where automation stops rather
  than pretending the whole model is machine-decidable.

  `triggeredBy` is kept, but optional: not every evidenced FOCAL case has a constraint precise
  enough to cite, and forcing one would mean inventing boundaries. At least one of `when` or
  `triggeredBy` is required, so no rule is left with no stated condition at all. Prefer `when`.
allOf:
  - "$ref": "bblocks://ogc.focal.transferability.notes"
  - type: object
    required:
      - actions
    anyOf:
      - required: [when]
      - required: [triggeredBy]
    properties:
      appliesTo:
        type: array
        minItems: 1
        items:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]*$"
        description: >
          Identifiers of the artifacts this rule governs, from the enclosing statement's
          `artifacts`. Several artifacts may share one rule — FP-WF2's four Czechia-specific
          reference files do. Omit for a rule that applies to the workflow as a whole.
      when:
        type: array
        minItems: 1
        items:
          "$ref": "#/$defs/condition"
        description: >
          The conditions under which this rule fires, ANDed together. Two conditions here mean
          both must hold; two rules mean either suffices.
      triggeredBy:
        type: string
        examples:
          - different-geographic-coverage
          - different-ecological-range
          - different-climate-regime
          - different-dataset
        description: >
          A coarse statement of what fires this rule, for cases where no envelope constraint can be
          cited precisely. Open vocabulary — see bblocks://ogc.focal.transferability.vocab.
      actions:
        type: array
        minItems: 1
        items:
          type: string
          examples:
            - reuse-as-is
            - replace-with-local-equivalent
            - retrain
            - replace-with-alternative-published-model
            - component-not-executable
        description: >
          One or more actions, any of which resolves the rule — an OR-set, not a required
          combination. No evidenced case needs two applied simultaneously.
      mandatory:
        type: boolean
        default: true
        description: >
          Whether applying one of `actions` is mandatory once the conditions hold. Defaults to
          true. When false, skipping is allowed but degrades result quality or trust rather than
          blocking execution — say what degrades in `transferabilityNotes`.

          Named `mandatory` rather than `required`: a data property spelled like a JSON Schema
          keyword reads as the keyword, and this one sits beside real `required` lists.
"$defs":
  condition:
    title: Envelope condition
    type: object
    required:
      - constraint
      - test
    additionalProperties: false
    properties:
      constraint:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9_-]*$"
        description: >
          The `id` of an envelope constraint in the enclosing statement's `envelope`.
      test:
        type: string
        examples:
          - outside
          - inside
        description: >
          How the target is compared against that constraint. `outside` is the condition under
          which almost every evidenced FOCAL rule fires; `inside` states the complementary case,
          which is what lets a cascade be written without losing its connecting condition —
          UP-WF2's "reuse within the domain, otherwise substitute or fail" is two rules over the
          same constraint. Open vocabulary — see bblocks://ogc.focal.transferability.vocab, where
          each term also records how it is evaluated per dimension.
