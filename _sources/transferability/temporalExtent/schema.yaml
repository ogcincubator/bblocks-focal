"$schema": https://json-schema.org/draft/2020-12/schema
title: Temporal Extent
x-jsonld-context: context.jsonld
description: >
  A single statement of the calendar span a workflow's results are valid over. Repeatable at the
  workflow level: FP-WF3 needs two related windows at once (an EO time-series window and the
  historical-damage window that precedes it). Evidenced 7/8 across FOCAL's pilot workflows (all but
  FP-WF4, an ongoing sensor observation with no fixed window — omit the property entirely there,
  same "optional, not a value" treatment as computationType).

  Two shapes, no `kind` discriminator needed:

  - `{start, end}` is the default: a plain calendar interval, covering 6 of the 7 evidenced
    workflows (FP-WF1, FP-WF2, FP-WF5, UP-WF2, UP-WF3, and FP-WF3 twice).
  - `{scenarioMarker}` is the one explicit exception: UP-WF1's "timeslices are represented as
    Global Warming Levels" is genuinely not calendar-indexed (a warming level is reached at
    different years depending on emissions scenario/ensemble member), so no interval can be
    derived from the source without fabricating one. **This value is pending direct review with
    the UP-WF1 workflow owner** — see the mapping-extraction doc's UP-WF1 section — asking whether
    a time interval can be declared per GWL slice at all.

  UP-WF3's accumulation-window (6h/12h/1d/7d) and temporal-aggregation-period
  (daily/weekly/monthly) values are workflow computation *parameters* (rolling-window length,
  output grouping), naturally expressed as CWL `CommandLineTool`/`Workflow` input parameters via
  `ogc.cwl.*` — not statements about the calendar span the workflow is valid over, so they belong
  there rather than in this property.
oneOf:
  - type: object
    title: Calendar interval
    required:
      - start
      - end
    additionalProperties: false
    properties:
      start:
        type: string
        description: >
          Start of the interval. Granularity is workflow-specific (a date, a year, a
          multi-year period) and not constrained here.
      end:
        type: string
        description: End of the interval, same granularity as `start`.
  - type: object
    title: Scenario-indexed marker
    required:
      - scenarioMarker
    additionalProperties: false
    properties:
      scenarioMarker:
        type: string
        examples:
          - GWL+1.5
          - GWL+2.0
        description: >
          A non-calendar, scenario-indexed temporal position (e.g. a Global Warming Level label)
          where no calendar interval can be stated. See the description above for the pending
          UP-WF1 owner review before treating any specific value here as settled.
