"$schema": https://json-schema.org/draft/2020-12/schema
title: Computation Type (mixin)
x-jsonld-context: context.jsonld
description: >
  Reusable mixin adding `computationType`, an open-vocabulary classification of how a workflow
  computes its results — see bblocks://ogc.focal.transferability.vocab for the seeded values
  (`statistical-ml`, `deterministic-rule-based`, `precomputed-delivery`). Evidenced 8/8 across
  FOCAL's pilot workflows, but not universal by design: **optional**, omitted entirely for a
  workflow that isn't an executable Application/ApplicationPackage at all (e.g. FP-WF4, an
  `ogcapi-sosa` observing system) — not a fourth "not applicable" value, the same way JSON Schema
  already handles a property that simply doesn't apply.
type: object
properties:
  computationType:
    type: string
    examples:
      - statistical-ml
      - deterministic-rule-based
      - precomputed-delivery
    description: >
      How the workflow computes its results. Open vocabulary (SKOS), not a closed enum — new
      values may be added without a schema change.
