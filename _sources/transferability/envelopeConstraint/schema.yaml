"$schema": https://json-schema.org/draft/2020-12/schema
title: Transferability Envelope Constraint
x-jsonld-context: context.jsonld
description: >
  A single statement describing part of a workflow's validity envelope: which `role` this fact
  plays (what the workflow was trained on vs. what it's valid for vs. what it can run on), which
  `dimension` it concerns (spatial, ecological, climatic, jurisdictional, temporal, ... — an open
  vocabulary, seeded small and expected to grow), and the `value` itself. Repeatable per workflow:
  FP-WF1 alone needs three of these at once (trained-on/spatial, valid-for/ecological,
  can-run-on/climatic) — role and dimension are independent axes, not a single enum choice,
  precisely so a new constraint axis can be added later as a new vocabulary term rather than a
  schema change.

  `transferabilityNotes` (mixed in from bblocks://ogc.focal.transferability.notes) is available on
  every constraint, for the caveat that `value` itself can't carry: an approximated geometry, an
  inferred rather than stated fact, a granularity the source left open.
allOf:
  - "$ref": "bblocks://ogc.focal.transferability.notes"
  - type: object
    required:
      - role
      - dimension
      - value
    properties:
      role:
        type: string
        examples:
          - trained-on
          - valid-for
          - can-run-on
        description: Which aspect of the envelope this statement describes.
      dimension:
        type: string
        examples:
          - spatial
          - ecological
          - climatic
          - jurisdictional
          - temporal
        description: >
          Which axis of variation this statement constrains. Open vocabulary, seeded deliberately
          small — expect WF-owner review to surface dimensions not yet listed here.
      value:
        description: >
          The constraint value itself, shaped by `dimension`:

          - `spatial`/`jurisdictional` — a real geographic/administrative extent, since text throws
            away exactly the thing this envelope model exists to support: an automated check like
            "does my AOI fall inside this workflow's `valid-for` area?" cannot be answered against a
            free-text label. `value` **must** be a GeoJSON Geometry (RFC 7946 §3.1: `Point`,
            `MultiPoint`, `Polygon`, or `MultiPolygon` — the shapes evidenced so far;
            `LineString`/`MultiLineString`/`GeometryCollection` can be added later if evidence needs
            them), even an approximate one (e.g. UP-WF2's EURO-CORDEX domain, rendered as its published
            bounding box) — not just permitted, since text is not a fallback for "haven't looked up the
            coordinates yet." A constraint whose source location genuinely can't be resolved should
            be omitted from `envelope` rather than filled with a placeholder string; record why in
            `transferabilityNotes` on a constraint that *can* be stated, or at workflow level.
          - `temporal` — the calendar span, or non-calendar scenario marker, results are valid over.
            `value` is either `{start, end}` (a plain calendar interval; granularity is
            workflow-specific — a date, a year, a multi-year period — and not constrained here) or
            `{scenarioMarker}` (a non-calendar, scenario-indexed position, e.g. a Global Warming Level
            label like `GWL+1.5`, for results that genuinely aren't calendar-indexed — a warming level
            is reached at different years depending on emissions scenario/ensemble member). A workflow
            with no fixed window at all (e.g. an ongoing sensor observation) should omit the entry
            rather than fabricate one.
          - `ecological`/`climatic` — the vocabulary's other two seeded dimension terms, neither a
            literal extent or interval — `value` stays plain `string`, since "a comparable ecological
            range" doesn't become more machine-readable by wrapping it in coordinates it doesn't have.
          - Any dimension term outside all four above — the vocabulary is open, so a term not yet
            seeded here is still allowed — falls back to plain `string` too, until evidence shows it
            needs its own structured shape.

          Four `oneOf` branches, not three: `ecological`/`climatic` get their own branch, listed by
          name, distinct from the catch-all for a genuinely new, not-yet-seeded dimension term — even
          though both branches currently validate `value` the same way (`string`). Keeping them apart
          makes each currently-known dimension term traceable to an explicit branch instead of only
          being defined by negation, and means that if a future known term (`ecological`, say) turns
          out to need its own structured `value` shape, it moves to a new named branch without
          disturbing what "not yet classified" means for everything else.

          No existing OGC Block carries a bare GeoJSON Geometry union standalone:
          `ogc.geo.common.data_types.geojson` (the main OGC register's stable GeoJSON block) only
          exposes this shape nested inside a full `Feature` wrapper (`type`/`properties`/`geometry`),
          no `$defs` fragment for just the geometry union — checked its actual schema, not assumed —
          which is heavier than a constraint value needs and isn't `$ref`-able as a bare fragment.
          This repo's own `forestStandFeature` hits the same wall (wraps the full
          `ogc.geo.features.feature` Feature shape, not a bare geometry), and no other register has
          one either. So, same posture as `qualityAnnotation` binding straight to DQV with no
          wrapping OGC Block to depend on, this binds directly to RFC 7946 rather than to a
          Feature-shaped block.
    oneOf:
      - title: Spatial/jurisdictional extent (geometry-valued)
        properties:
          dimension:
            enum:
              - spatial
              - jurisdictional
          value:
            $ref: "#/$defs/geoJSONGeometry"
        required:
          - dimension
          - value
      - title: Temporal extent (interval- or marker-valued)
        properties:
          dimension:
            enum:
              - temporal
          value:
            oneOf:
              - $ref: "#/$defs/calendarInterval"
              - $ref: "#/$defs/scenarioMarker"
        required:
          - dimension
          - value
      - title: Other seeded dimension (string-valued)
        properties:
          dimension:
            enum:
              - ecological
              - climatic
          value:
            type: string
        required:
          - dimension
          - value
      - title: Not-yet-seeded dimension (string-valued, open vocabulary)
        properties:
          dimension:
            not:
              enum:
                - spatial
                - jurisdictional
                - temporal
                - ecological
                - climatic
          value:
            type: string
        required:
          - dimension
          - value
"$defs":
  geoJSONGeometry:
    title: GeoJSON Geometry
    type: object
    required:
      - type
      - coordinates
    properties:
      type:
        type: string
        enum:
          - Point
          - MultiPoint
          - Polygon
          - MultiPolygon
        description: >
          The geometry type, per RFC 7946. Uplifts to `geojson:type` carrying the name as a
          string, so `?v geojson:type "Polygon"` is queryable.

          **It is deliberately not bound to `@type`**, which would be the more idiomatic modelling
          and is what GeoJSON's own published JSON-LD context does. Making `"Polygon"` expand to
          the class `geojson:Polygon` needs either `@vocab` or explicit class aliases in scope, and
          the schema annotator (`ogc-na`) can supply neither here: it rebuilds every scoped context
          from the schema's own properties, so aliases like `"Polygon": "geojson:Polygon"` are
          pruned as terms no property corresponds to, and setting `@vocab` on `value` instead makes
          it drop all of `value`'s sibling terms as vocab-implied — which silently turns `start`
          and `end` into `geojson:start`/`geojson:end`. Base-relative expansion cannot help either,
          because GeoJSON's namespace is hash-terminated: `"Polygon"` resolved against
          `https://purl.org/geojson/vocab#` gives `https://purl.org/geojson/Polygon`.

          The string binding is the shape that survives the toolchain intact. `shapes.shacl`
          enforces the four permitted values on the RDF side, which is the check the class would
          otherwise have given for free.
      coordinates:
        description: >
          Position array, nested per `type` as RFC 7946 §3.1 defines it (e.g. a `Polygon`'s
          coordinates are an array of linear rings, each an array of `[lon, lat]` positions).
          Left as `array` here rather than spelling out all four `type`-specific shapes, since
          JSON Schema can't easily key a nested shape off a sibling `enum` value without
          substantially more structure than a small, evidence-seeded constraint value needs.

          Uplifted as a single `rdf:JSON` literal (`"@type": "@json"` in the context), not as
          nested RDF lists: a coordinate array is one opaque value to every consumer that matters
          here, and exploding it into `rdf:first`/`rdf:rest` chains produces thousands of triples
          that nothing queries and that no triplestore indexes usefully.
        type: array
        x-jsonld-id: "https://purl.org/geojson/vocab#coordinates"
        x-jsonld-type: "@json"
  calendarInterval:
    title: Calendar interval
    type: object
    required:
      - start
      - end
    additionalProperties: false
    properties:
      start:
        type: string
        x-jsonld-id: "https://w3id.org/ogc/hosted/focal/transferability/properties/start"
        description: >
          Start of the interval. Granularity is workflow-specific (a date, a year, a multi-year
          period) and not constrained here.
      end:
        type: string
        x-jsonld-id: "https://w3id.org/ogc/hosted/focal/transferability/properties/end"
        description: End of the interval, same granularity as `start`.
  scenarioMarker:
    title: Scenario-indexed marker
    type: object
    required:
      - scenarioMarker
    additionalProperties: false
    properties:
      scenarioMarker:
        type: string
        x-jsonld-id: "https://w3id.org/ogc/hosted/focal/transferability/properties/scenarioMarker"
        examples:
          - GWL+1.5
          - GWL+2.0
        description: >
          A non-calendar, scenario-indexed temporal position (e.g. a Global Warming Level label)
          where no calendar interval can be stated.
