$schema: https://json-schema.org/draft/2020-12/schema
description: Example of a simple GeoJSON Feature specialisation
$defs:
  MyFeature:
    allOf:
    - $ref: https://opengeospatial.github.io/bblocks/annotated-schemas/geo/features/feature/schema.yaml
    - properties:
        properties:
          $ref: https://ogcincubator.github.io/bblocks-focal/build/annotated/focal/forestStandProperties/schema.yaml
anyOf:
- $ref: '#/$defs/MyFeature'
x-bblocks-metadata:
  itemIdentifier: ogc.focal.forestStandFeature
  register: https://ogcincubator.github.io/bblocks-focal/build/register.json
  version: '1.0'
  dateOfLastChange: '2026-11-10'
