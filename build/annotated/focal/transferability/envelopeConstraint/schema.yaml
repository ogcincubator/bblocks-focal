$schema: https://json-schema.org/draft/2020-12/schema
title: Transferability Envelope Constraint
description: "A single statement describing part of a workflow's validity envelope:
  which `role` this fact plays (what the workflow was trained on vs. what it's valid
  for vs. what it can run on), which `dimension` it concerns (spatial, ecological,
  climatic, jurisdictional, temporal, ... \u2014 an open vocabulary, seeded small
  and expected to grow), and the `value` itself. Repeatable per workflow: FP-WF1 alone
  needs three of these at once (trained-on/spatial, valid-for/ecological, can-run-on/climatic)
  \u2014 role and dimension are independent axes, not a single enum choice, precisely
  so a new constraint axis can be added later as a new vocabulary term rather than
  a schema change.\n"
type: object
required:
- role
- dimension
- value
properties:
  role:
    type: string
    examples:
    - trained-on
    - valid-for
    - can-run-on
    description: Which aspect of the envelope this statement describes.
    x-jsonld-id: https://w3id.org/ogc/hosted/focal/transferability/properties/role
    x-jsonld-type: '@id'
    x-jsonld-base: https://w3id.org/ogc/hosted/focal/transferability/roles/
  dimension:
    type: string
    examples:
    - spatial
    - ecological
    - climatic
    - jurisdictional
    - temporal
    description: "Which axis of variation this statement constrains. Open vocabulary,
      seeded deliberately small \u2014 expect WF-owner review to surface dimensions
      not yet listed here.\n"
    x-jsonld-id: https://w3id.org/ogc/hosted/focal/transferability/properties/dimension
    x-jsonld-type: '@id'
    x-jsonld-base: https://w3id.org/ogc/hosted/focal/transferability/dimensions/
  value:
    description: "The constraint value itself, shaped by `dimension`:\n- `spatial`/`jurisdictional`
      \u2014 a real geographic/administrative extent, since text throws\n  away exactly
      the thing this envelope model exists to support: an automated check like\n  \"does
      my AOI fall inside this workflow's `valid-for` area?\" cannot be answered against
      a\n  free-text label. `value` **must** be a GeoJSON Geometry (RFC 7946 \xA73.1:
      `Point`,\n  `MultiPoint`, `Polygon`, or `MultiPolygon` \u2014 the shapes evidenced
      so far;\n  `LineString`/`MultiLineString`/`GeometryCollection` can be added
      later if evidence needs\n  them), even an approximate one (e.g. UP-WF2's EURO-CORDEX
      domain, rendered as its published\n  bounding box) \u2014 not just permitted,
      since text is not a fallback for \"haven't looked up the\n  coordinates yet.\"
      A workflow with a genuinely unlocatable `spatial`/`jurisdictional` fact\n  (no
      resolvable source location at all) should omit that envelope entry, or use\n
      \ `transferability/notes`' `transferabilityNotes` on a sibling fact to record
      the caveat in\n  prose, rather than smuggling free text into `value`.\n- `temporal`
      \u2014 the calendar span, or non-calendar scenario marker, results are valid
      over.\n  `value` is either `{start, end}` (a plain calendar interval; granularity
      is\n  workflow-specific \u2014 a date, a year, a multi-year period \u2014 and
      not constrained here) or\n  `{scenarioMarker}` (a non-calendar, scenario-indexed
      position, e.g. a Global Warming Level\n  label like `GWL+1.5`, for results that
      genuinely aren't calendar-indexed \u2014 a warming level\n  is reached at different
      years depending on emissions scenario/ensemble member). A workflow\n  with no
      fixed window at all (e.g. an ongoing sensor observation) should omit the entry\n
      \ rather than fabricate one.\n- `ecological`/`climatic` \u2014 the vocabulary's
      other two seeded dimension terms, neither a\n  literal extent or interval \u2014
      `value` stays plain `string`, since \"a comparable ecological\n  range\" doesn't
      become more machine-readable by wrapping it in coordinates it doesn't have.\n-
      Any dimension term outside all four above \u2014 the vocabulary is open, so
      a term not yet\n  seeded here is still allowed \u2014 falls back to plain `string`
      too, until evidence shows it\n  needs its own structured shape.\n\nFour `oneOf`
      branches, not three: `ecological`/`climatic` get their own branch, listed by
      name, distinct from the catch-all for a genuinely new, not-yet-seeded dimension
      term \u2014 even though both branches currently validate `value` the same way
      (`string`). Keeping them apart makes each currently-known dimension term traceable
      to an explicit branch instead of only being defined by negation, and means that
      if a future known term (`ecological`, say) turns out to need its own structured
      `value` shape, it moves to a new named branch without disturbing what \"not
      yet classified\" means for everything else.\nNo existing OGC Block carries a
      bare GeoJSON Geometry union standalone: `ogc.geo.common.data_types.geojson`
      (the main OGC register's stable GeoJSON block) only exposes this shape nested
      inside a full `Feature` wrapper (`type`/`properties`/`geometry`), no `$defs`
      fragment for just the geometry union \u2014 checked its actual schema, not assumed
      \u2014 which is heavier than a constraint value needs and isn't `$ref`-able
      as a bare fragment. This repo's own `forestStandFeature` hits the same wall
      (wraps the full `ogc.geo.features.feature` Feature shape, not a bare geometry),
      and no other register has one either. So, same posture as `qualityAnnotation`
      binding straight to DQV with no wrapping OGC Block to depend on, this binds
      directly to RFC 7946 rather than to a Feature-shaped block.\n"
    x-jsonld-id: https://w3id.org/ogc/hosted/focal/transferability/properties/value
    x-jsonld-extra-terms:
      coordinates:
        x-jsonld-container: '@list'
        x-jsonld-id: https://purl.org/geojson/vocab#coordinates
      start: https://w3id.org/ogc/hosted/focal/transferability/properties/start
      end: https://w3id.org/ogc/hosted/focal/transferability/properties/end
      scenarioMarker: https://w3id.org/ogc/hosted/focal/transferability/properties/scenarioMarker
oneOf:
- title: Spatial/jurisdictional extent (geometry-valued)
  properties:
    dimension:
      enum:
      - spatial
      - jurisdictional
      x-jsonld-id: https://w3id.org/ogc/hosted/focal/transferability/properties/dimension
      x-jsonld-type: '@id'
      x-jsonld-base: https://w3id.org/ogc/hosted/focal/transferability/dimensions/
    value:
      $ref: '#/$defs/geoJSONGeometry'
      x-jsonld-id: https://w3id.org/ogc/hosted/focal/transferability/properties/value
  required:
  - dimension
  - value
- title: Temporal extent (interval- or marker-valued)
  properties:
    dimension:
      enum:
      - temporal
      x-jsonld-id: https://w3id.org/ogc/hosted/focal/transferability/properties/dimension
      x-jsonld-type: '@id'
      x-jsonld-base: https://w3id.org/ogc/hosted/focal/transferability/dimensions/
    value:
      oneOf:
      - $ref: '#/$defs/calendarInterval'
      - $ref: '#/$defs/scenarioMarker'
      x-jsonld-id: https://w3id.org/ogc/hosted/focal/transferability/properties/value
  required:
  - dimension
  - value
- title: Other seeded dimension (string-valued)
  properties:
    dimension:
      enum:
      - ecological
      - climatic
      x-jsonld-id: https://w3id.org/ogc/hosted/focal/transferability/properties/dimension
      x-jsonld-type: '@id'
      x-jsonld-base: https://w3id.org/ogc/hosted/focal/transferability/dimensions/
    value:
      type: string
      x-jsonld-id: https://w3id.org/ogc/hosted/focal/transferability/properties/value
  required:
  - dimension
  - value
- title: Not-yet-seeded dimension (string-valued, open vocabulary)
  properties:
    dimension:
      not:
        enum:
        - spatial
        - jurisdictional
        - temporal
        - ecological
        - climatic
      x-jsonld-id: https://w3id.org/ogc/hosted/focal/transferability/properties/dimension
      x-jsonld-type: '@id'
      x-jsonld-base: https://w3id.org/ogc/hosted/focal/transferability/dimensions/
    value:
      type: string
      x-jsonld-id: https://w3id.org/ogc/hosted/focal/transferability/properties/value
  required:
  - dimension
  - value
$defs:
  geoJSONGeometry:
    title: GeoJSON Geometry
    type: object
    required:
    - type
    - coordinates
    properties:
      type:
        type: string
        enum:
        - Point
        - MultiPoint
        - Polygon
        - MultiPolygon
        x-jsonld-id: '@type'
      coordinates:
        description: "Position array, nested per `type` as RFC 7946 \xA73.1 defines
          it (e.g. a `Polygon`'s coordinates are an array of linear rings, each an
          array of `[lon, lat]` positions). Left as `array` here rather than spelling
          out all four `type`-specific shapes, since JSON Schema can't easily key
          a nested shape off a sibling `enum` value without substantially more structure
          than a small, evidence-seeded constraint value needs.\n"
        type: array
        x-jsonld-container: '@list'
        x-jsonld-id: https://purl.org/geojson/vocab#coordinates
  calendarInterval:
    title: Calendar interval
    type: object
    required:
    - start
    - end
    additionalProperties: false
    properties:
      start:
        type: string
        description: 'Start of the interval. Granularity is workflow-specific (a date,
          a year, a multi-year period) and not constrained here.

          '
        x-jsonld-id: https://w3id.org/ogc/hosted/focal/transferability/properties/start
      end:
        type: string
        description: End of the interval, same granularity as `start`.
        x-jsonld-id: https://w3id.org/ogc/hosted/focal/transferability/properties/end
  scenarioMarker:
    title: Scenario-indexed marker
    type: object
    required:
    - scenarioMarker
    additionalProperties: false
    properties:
      scenarioMarker:
        type: string
        examples:
        - GWL+1.5
        - GWL+2.0
        description: 'A non-calendar, scenario-indexed temporal position (e.g. a Global
          Warming Level label) where no calendar interval can be stated.

          '
        x-jsonld-id: https://w3id.org/ogc/hosted/focal/transferability/properties/scenarioMarker
x-jsonld-extra-terms:
  Point: https://purl.org/geojson/vocab#Point
  MultiPoint: https://purl.org/geojson/vocab#MultiPoint
  Polygon: https://purl.org/geojson/vocab#Polygon
  MultiPolygon: https://purl.org/geojson/vocab#MultiPolygon
x-jsonld-prefixes:
  focal-transf-prop: https://w3id.org/ogc/hosted/focal/transferability/properties/
  geojson: https://purl.org/geojson/vocab#
